<svg width="260" height="64" viewBox="0 0 260 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card { fill: #f2e6c9; stroke: #3a2e1d; stroke-width: 1.5; }
      .scan { fill: #d1352b; opacity: 0.55; animation: sweep 2.2s ease-in-out infinite; }
      @keyframes sweep {
        0%   { transform: translateX(0); }
        50%  { transform: translateX(220px); }
        100% { transform: translateX(0); }
      }
      .ok {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 11px;
        fill: #2d6a34;
        letter-spacing: 2px;
        animation: blink 2.2s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 40% { opacity: 0; }
        50%, 90% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </defs>
