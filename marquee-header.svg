<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bulb {
        fill: #4a3a1e;
        filter: url(#glow);
        animation: chase 2.8s linear infinite;
      }
      @keyframes chase {
        0%   { fill: #4a3a1e; }
        6%   { fill: #ffd873; }
        16%  { fill: #4a3a1e; }
        100% { fill: #4a3a1e; }
      }
      .title {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 54px;
        fill: #f6c453;
        letter-spacing: 6px;
      }
      .sub {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 15px;
        fill: #d68f3c;
        letter-spacing: 3px;
        animation: flicker 3.6s ease-in-out infinite;
      }
      @keyframes flicker {
        0%, 92%, 100% { opacity: 1; }
        94% { opacity: 0.55; }
        96% { opacity: 1; }
        97% { opacity: 0.65; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="220" fill="url(#bg)"/>
